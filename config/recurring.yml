# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Report PDFs are disposable — the markdown they were built from is cached on
  # the Verto, so any of them can be re-rendered on demand. Without this they'd
  # accumulate on a 1GB disk for downloads nobody will repeat.
  sweep_report_renders:
    command: "ReportRender.sweepable.find_each(&:destroy)"
    schedule: every day at 4am

  # An approved Verto keeps collecting, so its Ask Verto index goes stale the day
  # after it is approved. This enqueues one job PER Verto rather than doing the
  # work here — Solid Queue runs inside Puma on a small instance, and one job
  # holding every contributed Verto's aggregation at once is exactly the memory
  # shape the watchdog restarts the process for.
  refresh_ask_verto_corpus:
    command: "IndexCorpusEntryJob.refresh_all!"
    schedule: every day at 3am

  # The safety net under Comms' set(wait_until:) scheduling: Solid Queue
  # rides inside Puma and the memory watchdog restarts Puma, so a scheduled
  # send's job can vanish and an in-flight batch can die mid-claim. The sweep
  # re-enqueues due campaigns, reaps stuck recipients, re-pokes stalled sends
  # and finalizes finished ones (all idempotent — claims make double-enqueues
  # harmless).
  comms_sweep:
    class: Comms::SweepJob
    schedule: every 5 minutes
