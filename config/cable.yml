# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  # No connects_to: the cable tables live in the primary database (see
  # CreateSolidCableTables).
  #
  # 0.5s rather than the generated 0.1s. Solid Cable polls the database for
  # messages, so the interval is a standing query rate against a small Postgres —
  # ten a second, forever, for a live response counter that nobody needs
  # sub-second. Half a second still reads as instant.
  polling_interval: 0.5.seconds
  message_retention: 1.day
