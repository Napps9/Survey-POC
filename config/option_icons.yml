# Per-option icon catalogue, consumed by app/lib/option_icon_library.rb.
#
# Each entry maps a curated SVG under app/assets/images/option-icons/ to the
# option label(s) it should render for. Matching is EXACT (after normalising
# case/punctuation/whitespace) against `keywords` — deliberately conservative
# so an option's text never picks up a surprising or wrong icon. Keep each
# keyword phrase unambiguous: prefer the full compound phrase ("golf ball")
# over a bare generic word ("ball") that could collide with a future icon.
#
# Adding a new icon: drop the SVG into app/assets/images/option-icons/
# (kebab-case filename) and add an entry below with `file:` + `keywords:`.
# This file is loaded once at boot (OptionIconLibrary::DATA) — restart the
# dev server to pick up changes, same as config/card_types.yml.

