default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # Two job threads, not the generated three. The worker runs as threads
      # inside the Puma process (solid_queue_mode :async, config/puma.rb) on a
      # 512MB Render instance that is memory-constrained (jemalloc,
      # MALLOC_ARENA_MAX and the cgroup memory watchdog are all in play), and
      # every job here is a Claude call holding its response in memory. Two is
      # enough that one slow generation doesn't block the next, without
      # crowding the request threads sharing the process.
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
