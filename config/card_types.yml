# Single source of truth for question-card type metadata.
#
# Consumed by:
#   - Ruby: app/lib/card_types.rb (class methods used by helpers + views)
#   - JS:   app/javascript/controllers/type_panel_controller.js, which reads
#           a JSON blob emitted by surveys/show.html.erb (from the same YAML).
#
# Order matters — it's the order the picker shows. `pickable: false` hides
# a type from the picker but keeps its metadata available for rendering
# saved cards.
#
# `retired: true` goes further: the type is withdrawn from the product. It
# can't be picked, can't be saved onto a deck, and the player skips any copy
# still sitting in a published deck — but the metadata stays, because the
# results dashboard still has to label answers collected while it was live.
# See CardTypes.retired?.

range:
  badge:        "RANGE"
  badge_css:    "sb-range"
  accent:       "#615BF5"
  panel_label:  "DRAG THE SLIDER"
  eyebrow:      "Drag the slider"
  picker_name:  "Range / Slider"
  picker_desc:  "Drag along a scale"
  explainer:    "A slider respondents drag along a labelled scale. Best for intensity or agreement where the two ends define a spectrum — e.g. 'Not at all' to 'Completely'."
  picker_icon:  "↔"
  pickable:     true

rating:
  badge:        "RATING"
  badge_css:    "sb-range"
  accent:       "#FFCC00"
  panel_label:  "TAP TO RATE"
  eyebrow:      "Tap to rate"
  picker_name:  "Rating"
  picker_desc:  "Slider with star rating"
  explainer:    "A 1–5 star tap. Instantly understood and gives a comparable score across questions — ideal for quality or satisfaction."
  picker_icon:  "★"
  pickable:     true

nps:
  badge:        "NPS"
  badge_css:    "sb-range"
  accent:       "#FFCC00"
  panel_label:  "DRAG LIQUID"
  eyebrow:      "Drag liquid"
  picker_name:  "NPS / Reactive scale"
  picker_desc:  "Themed scale with a reacting visual"
  explainer:    "A 5-point scale with a character that reacts as they answer. Use when an engaging visual lifts response quality on a likelihood or sentiment question."
  picker_icon:  "📈"
  pickable:     true

multiple_choice:
  badge:        "PICK ONE"
  badge_css:    "sb-range"
  accent:       "#615BF5"
  panel_label:  "CHOOSE ONE"
  eyebrow:      "Choose one"
  picker_name:  "Image List — One"
  picker_desc:  "Single choice, image left of each option"
  explainer:    "A single-pick list with an image beside each option. Best for one-of-several choices where a picture aids recognition."
  picker_icon:  "◉"
  pickable:     true

select_many:
  badge:        "SELECT MANY"
  badge_css:    "sb-range"
  accent:       "#615BF5"
  panel_label:  "CHOOSE ALL THAT APPLY"
  eyebrow:      "Choose all that apply"
  picker_name:  "Image List — Many"
  picker_desc:  "Multi-choice, image left of each option"
  explainer:    "A multi-pick list with an image beside each option. Use when respondents can choose more than one answer."
  picker_icon:  "☑"
  pickable:     true

prioritise:
  badge:        "PRIORITISE"
  badge_css:    "sb-rank"
  accent:       "#8B85FF"
  panel_label:  "DRAG INTO ORDER"
  eyebrow:      "Arrange in order of priority"
  picker_name:  "Prioritise"
  picker_desc:  "Drag to rank in order"
  explainer:    "A list respondents drag into an order of priority (highest to lowest). Richer than select one/many — you learn the ORDER of preference, not just the picks. Best with about 5 options so analysis can surface a clear top three."
  picker_icon:  "≡"
  pickable:     true

yes_no:
  badge:        "YES / NO"
  badge_css:    "sb-range"
  accent:       "#0CA7FF"
  panel_label:  "CHOOSE ONE"
  eyebrow:      "Choose one"
  picker_name:  "Yes / No"
  picker_desc:  "Simple two-option choice"
  explainer:    "A simple two-option choice. Best for a clear binary — use sparingly so the Verto doesn't feel like a checklist."
  picker_icon:  "⇌"
  pickable:     true

select_one_grid:
  badge:        "IMAGE GRID"
  badge_css:    "sb-choice"
  accent:       "#615BF5"
  panel_label:  "CHOOSE ONE"
  eyebrow:      "Choose one"
  picker_name:  "Image Grid — One"
  picker_desc:  "Photo grid, single pick"
  explainer:    "A photo grid where respondents pick one tile. Great for visual, single-choice questions with strong imagery."
  picker_icon:  "▣"
  pickable:     true

select_many_grid:
  badge:        "IMAGE GRID"
  badge_css:    "sb-choice"
  accent:       "#615BF5"
  panel_label:  "CHOOSE ALL THAT APPLY"
  eyebrow:      "Choose all that apply"
  picker_name:  "Image Grid — Many"
  picker_desc:  "Photo grid, multi-pick"
  explainer:    "A photo grid where respondents pick several tiles. Great for visual, multi-choice questions with strong imagery."
  picker_icon:  "⊞"
  pickable:     true

tap_card:
  # These four are the ENGLISH FALLBACK only — card.badge/panel_label/eyebrow.tap_card
  # in the locale files win when present (see CardTypes.badge). picker_name and
  # picker_desc below are NOT localised and are read straight from here.
  # badge_css stays "sb-swipe": it is an internal colour class shared with
  # another type, nobody sees it, and renaming it would touch that type for
  # no gain.
  badge:        "TAP"
  badge_css:    "sb-swipe"
  accent:       "#0CA7FF"
  panel_label:  "TAP TO RESPOND"
  eyebrow:      "Tap to respond"
  picker_name:  "Tap Cards"
  picker_desc:  "Tap to agree / disagree"
  explainer:    "A small deck respondents tap through to agree or disagree with, one statement at a time. Engaging for a quick gut take across a few related items."
  picker_icon:  "⇄"
  pickable:     true

scenario:
  badge:        "SCENARIO"
  badge_css:    "sb-swipe"
  accent:       "#0CA7FF"
  panel_label:  "READ ON, THEN CHOOSE"
  eyebrow:      "Read on, then choose"
  picker_name:  "Scenario"
  picker_desc:  "A short story, then a choice"
  explainer:    "A multi-page narrative — respondents turn through story pages like a book, then pick between 2–3 options on the final page. Best for longer, situational prompts that would overwhelm a single question card."
  picker_icon:  "📖"
  pickable:     true

open_ended:
  badge:        "OPEN TEXT"
  badge_css:    "sb-text"
  accent:       "#FF1E6F"
  panel_label:  "TYPE YOUR ANSWER"
  eyebrow:      "Type your answer"
  picker_name:  "Open Text"
  picker_desc:  "Free-form written answer"
  explainer:    "A free-text box for answers in their own words. Use for qualitative 'why' or 'tell us…' questions — richer, but harder to compare at scale."
  picker_icon:  "✏"
  pickable:     true

contact_form:
  badge:        "CONTACT"
  badge_css:    "sb-text"
  accent:       "#FF1E6F"
  panel_label:  "SHARE YOUR DETAILS"
  eyebrow:      "Share your details"
  picker_name:  "Contact details"
  picker_desc:  "Name, company, industry, email"
  explainer:    "RETIRED. A lead-capture card that collected name, company, industry and email — the one card type that ever collected identifying data. It can no longer be added, and the player skips any copy left in a published deck, so nothing more is collected. Details gathered while it was live are still in that Verto's results and exports."
  picker_icon:  "✉"
  pickable:     false
  retired:      true

welcome_card:
  badge:        "WELCOME CARD"
  badge_css:    "sb-welcome"
  accent:       "#01EACB"
  panel_label:  ""
  eyebrow:      ""
  picker_name:  "Welcome Card"
  picker_desc:  "Intro — no answer required"
  explainer:    "An intro screen shown first, with no answer required. Sets the scene and invites people in."
  picker_icon:  "👋"
  pickable:     true

token_checkpoint:
  badge:        "CHECKPOINT"
  badge_css:    "sb-welcome"
  accent:       "#01EACB"
  panel_label:  ""
  eyebrow:      ""
  picker_name:  "Points Checkpoint"
  picker_desc:  "Shows points earned so far — no answer required"
  explainer:    "A milestone screen that reveals the points collected so far. Only available once Tokenisation is on — great for a long Verto, giving players a boost of momentum partway through."
  picker_icon:  "🏆"
  pickable:     true

# Multi-page consent, as a real card in the deck. The survey-level consent gate
# (consent_text + consent_image) is a single pseudo-card pinned before the
# welcome card and can't be paged or reordered; this can do both, because it's an
# ordinary card. Pages are stored exactly like a scenario's, so it inherits that
# type's page sanitiser, id-keyed translations and page-turn widget.
consent_gate:
  badge:        "CONSENT"
  badge_css:    "sb-welcome"
  accent:       "#FFC24B"
  panel_label:  ""
  eyebrow:      ""
  picker_name:  "Consent screens"
  picker_desc:  "Multi-page consent — agree to continue"
  explainer:    "Consent spread over as many screens as it needs — an information sheet, then the agreement. Respondents turn through the pages and agree (or decline) on the last one; declining ends the Verto for them. Use this instead of the single consent gate when there's too much to fit on one screen."
  picker_icon:  "📋"
  pickable:     true

# The respondent code, as a card in the deck.
#
# The code itself is not new — it has been a survey-level PRE-SCREEN since the
# waves feature, a pseudo-card pinned before the deck (respondent_code_enabled).
# As a real card it can sit wherever the creator wants it, which is the ask:
# after a welcome card, after a consent gate, or mid-deck once someone has
# invested a few answers and is likelier to bother.
#
# Same relationship to the switch that consent_gate has to consent_text — the
# card supersedes it (Survey#respondent_code_prescreen?) rather than doubling
# it up. Non-question: what it captures is recorded on the response as an HMAC
# digest, never as an answer, exactly like a consent gate's agreement.
respondent_code:
  badge:        "RESPONDENT CODE"
  badge_css:    "sb-welcome"
  accent:       "#0CA7FF"
  panel_label:  ""
  eyebrow:      ""
  picker_name:  "Respondent code"
  picker_desc:  "A code they invent, to link their runs"
  explainer:    "Asks respondents to make up a short code they'll remember. It's stored only as a one-way hash, so nobody can read it or recognise someone across other Vertos — but the same code given again matches their runs to each other. Use it to measure change between waves, and (with recall on) to carry ask-once answers to a new device."
  picker_icon:  "🔑"
  pickable:     true
