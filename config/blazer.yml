# Internal BI for VertoNow staff — see https://github.com/ankane/blazer
#
# Access is gated in config/routes.rb (BLAZER_STAFF_EMAILS allowlist), not here.

data_sources:
  main:
    # Defaults to the app's own database: BLAZER_DATABASE_URL (set this to a
    # read replica if you'd rather not query the primary) → else the app's
    # DATABASE_URL in production → else the app connection in dev/test. Blazer
    # only ever issues read-only SQL.
    url: <%= ENV["BLAZER_DATABASE_URL"] || ENV["DATABASE_URL"] %>

    # Kill runaway queries (seconds). Internal tool, but keep prod safe.
    timeout: 30

    smart_variables:
      # Verto picker for the "Content — …" queries: shows "Org — Verto", submits
      # the id. Excludes internal orgs, matching the dashboards.
      verto_id: "SELECT s.id, o.name || ' — ' || s.title FROM surveys s JOIN organisations o ON o.id = s.organisation_id WHERE NOT o.internal ORDER BY o.name, s.title"
      # zone_id: "SELECT id, name FROM zones ORDER BY name ASC"
      # period: ["day", "week", "month"]
      # status: {0: "Active", 1: "Archived"}

    linked_columns:
      # user_id: "/admin/users/{value}"

    smart_columns:
      # user_id: "SELECT id, name FROM users WHERE id IN {value}"

# create audits
audit: true

# change the time zone
# time_zone: "Pacific Time (US & Canada)"

# Attribute queries + audits to the acting staff user. current_blazer_staff is
# defined on ApplicationController (which Blazer's controllers inherit).
user_class: User
user_method: current_blazer_staff
user_name: name

# email to send checks from
# from_email: blazer@example.org

# webhook for Slack
# slack_webhook_url: <%= ENV["BLAZER_SLACK_WEBHOOK_URL"] %>

check_schedules:
  - "1 day"
  - "1 hour"
  - "5 minutes"

# enable anomaly detection
# note: with trend, time series are sent to https://trendapi.org
# anomaly_checks: prophet / trend / anomaly_detection

# enable forecasting
# note: with trend, time series are sent to https://trendapi.org
# forecasting: prophet / trend

# enable map
# mapbox_access_token: <%= ENV["MAPBOX_ACCESS_TOKEN"] %>

# enable uploads
# uploads:
#   url: <%= ENV["BLAZER_UPLOADS_URL"] %>
#   schema: uploads
#   data_source: main
