    s1_eyebrow: Adım 01 · Verto'nuz hakkında
    s1_lead: Tek bir kapsayıcı konu.
    s1_body: Geniş tutun — sonraki adımlarda odağı daraltacaksınız. Genellikle bir veya iki kelime yeterlidir.
    s1_examples:
    - İklim eylemi
    - Mülteci eğitimi
    - Gıda güvenliği
    s1_title: Verto'nuz ne hakkında?
    s1_placeholder: örn. Gençlerin esenliği
    s1_hint_body: Geniş tutun — sonraki adımlarda odağı daraltacaksınız.
    s2_eyebrow: Adım 02 · Kimler yanıtlıyor
    s2_lead: "Önce yaş — sonra yer ve bağlam."
    s2_body: "Yaş aralığıyla başla, sonra nerede olduklarını ve ne yaptıklarını ekle. 'Manchester'da 25–40 yaş hemşireler', 'yetişkinler'den iyidir — yaş, yer, rol, dil ve yaşam tarzı yazdığımız soruları keskinleştirir."
    s2_examples:
    - Kenya'da 18–24 yaş üniversite öğrencileri
    - 35–55 yaş arası saha topluluk sağlığı çalışanları
    - Kırsal NSW'de okul çağında çocuğu olan ebeveynler
    s2_title: Kimler yanıtlıyor — ve yaşları nedir?
    s2_placeholder: örn. Kenya'da 18–24 yaş üniversite öğrencileri
    s2_hint_body: Yaşam tarzı, rol, bölge, dil — bu grubun düşünme şeklini etkileyen her şey.
    s3_eyebrow: Adım 03 · Öğrenme hedefi
    s3_lead: Bir kararı değiştirebilecek içgörü.
    s3_body: Zaten bildiklerinizi atlayın. Öğrendiğinizde sonraki adımınızı değiştirecek tek şeyi hedefleyin.
    s3_examples:
    - Gönüllüler neden üçüncü aydan sonra ayrılıyor?
    - İnsanların gıda bankamıza erişmesini ne engelliyor?
    - Gençlik programımız özgüveni gerçekten artırıyor mu — ve tam olarak nerede?
    s3_title: Onlardan ne öğrenmek istiyorsunuz?
    s3_placeholder: örn. Gönüllüler neden üçüncü aydan sonra ayrılıyor?
    s3_hint_body: Bildiklerinizi atlayın — sonraki adımınızı değiştirecek tek şeyi hedefleyin.
    s4_eyebrow: Adım 04 · Diller
    s4_lead: Herkese kendi dilinde ulaşın.
    s4_body: Verto'yu birincil dilinizde yazacağız, ardından diğer her dilde aynı kalitede bir sürüm hazırlayacağız. Her sürüm aynı soruları sorar, böylece sonuçlar tutarlı kalır.
    s4_title: Bu Verto hangi dilleri konuşmalı?
