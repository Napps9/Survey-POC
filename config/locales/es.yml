  templates:
    eyebrow: Plantillas
    heading_html: Empieza con una <span style="color:#615BF5;">plantilla</span>
    subtitle: 'Elige un Verto listo para usar y empieza a recoger respuestas en minutos:
      cada plantilla es totalmente editable.'
    back: Volver al panel
    import_instead: "¿Ya tienes preguntas? Impórtalas en su lugar →"
    use: Usar esta plantilla
