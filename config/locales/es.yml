    welcome_sub: Convertiremos tu brief en un Verto que sigue las reglas de Playverto.
    welcome_ready_html: Presiona <strong style="color:rgba(0,0,0,0.6);">Siguiente</strong> cuando estés listo.
    examples: Ejemplos
    s1_eyebrow: Paso 01 · Sobre tu Verto
    s1_lead: El tema principal y general.
    s1_body: Mantenlo amplio — afinarás el enfoque en los siguientes pasos. Una o dos palabras suele ser suficiente.
    s1_examples:
    - Acción climática
    - Educación para refugiados
    - Seguridad alimentaria
    s1_title: "¿De qué trata tu Verto?"
    s1_placeholder: p. ej. Bienestar juvenil
    s1_hint_body: Mantenlo amplio — afinarás el enfoque en los siguientes pasos.
    s2_eyebrow: Paso 02 · Quién responde
    s2_lead: "Primero la edad, luego el lugar y el contexto."
    s2_body: "Empieza con el rango de edad y añade dónde están y qué hacen. «Enfermeras de 25–40 en Manchester» supera a «adultos»: edad, lugar, rol, idioma y estilo de vida afinan las preguntas que escribimos."
    s2_examples:
    - Universitarios de 18 a 24 años en Kenia
    - Trabajadores de salud comunitaria de primera línea de 35 a 55 años
    - Padres de niños en edad escolar en zonas rurales de NSW
    s2_title: "¿Quién responde y qué edad tiene?"
    s2_placeholder: p. ej. Universitarios de 18 a 24 años en Kenia
    s2_hint_body: Estilo de vida, rol, región, idioma — todo lo que influya en cómo piensa este grupo.
    s3_eyebrow: Paso 03 · El objetivo de aprendizaje
    s3_lead: La información que cambiaría una decisión.
    s3_body: Omite lo que ya sabes. Apunta a esa única cosa que, si la aprendieras, cambiaría lo que harías a continuación.
    s3_examples:
    - "¿Por qué los voluntarios abandonan después del tercer mes?"
    - "¿Qué impide que la gente acceda a nuestro banco de alimentos?"
    - "¿Nuestro programa juvenil realmente aumenta la confianza — y en qué aspectos exactamente?"
    s3_title: "¿Qué quieres aprender de ellos?"
    s3_placeholder: p. ej. ¿Por qué los voluntarios abandonan después del tercer mes?
    s3_hint_body: Omite lo que ya sabes — apunta a esa única cosa que cambiaría lo que harías a continuación.
    s4_eyebrow: Paso 04 · Idiomas
    s4_lead: Llega a todos en su propio idioma.
    s4_body: Escribiremos el Verto en tu idioma principal y luego crearemos una versión igualmente buena en cada otro idioma. Todas las versiones hacen las mismas preguntas, así que los resultados se mantienen alineados.
