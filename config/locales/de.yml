    intro: "Ihre E-Mail-Adresse ist bestätigt. Ein Verto ist eine Umfrage, die man gern beantwortet: Karten zum Durchtippen statt eines Formulars, das man über sich ergehen lässt. Am schnellsten sehen Sie das, wenn Sie mit einer Vorlage beginnen und die Fragen austauschen."
    cta: "Mit einer Vorlage starten"
    step_one: "Wählen Sie eine Vorlage, oder beschreiben Sie, was Sie herausfinden möchten, und Playverto entwirft die Fragen."
    step_two: "Bearbeiten Sie jede Karte. Der Verto-Score rechts zeigt Ihnen, was funktioniert und was nicht."
    step_three: "Veröffentlichen Sie und teilen Sie den Link oder den QR-Code. Die Ergebnisse laufen ein, während geantwortet wird."
    footer: "Woanders angemeldet? Ihr Dashboard finden Sie immer hier:"
    sent_by: "Gesendet von Playverto"
