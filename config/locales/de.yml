    demographics_note: "Jedes Verto endet mit 3 festen demografischen Fragen — Geburtsjahr, Wohnort und Geschlecht. Verto fügt sie automatisch hinzu: Sie halten die Datenerhebung konsistent und bauen ein Forschungskollektiv über die ganze Plattform auf."
