    s6_eyebrow: Schritt 06 · Kontext
    optional: Optional
    s6_lead: Sollen wir noch etwas berücksichtigen?
    s6_body: Tonalität, Pflichtfragen, zu vermeidende Themen, Besonderheiten der Zielgruppe. Überspringe es, wenn nichts weiter nötig ist.
    s6_examples:
    - Muss eine Frage zu Finanzierungswegen und Hürden bei Förderungen enthalten.
    - Vermeide Fachjargon — viele Teilnehmende sprechen Englisch als Zweitsprache.
    - Halte den Ton warm, nicht förmlich.
    s6_title: Sollten wir sonst noch etwas wissen?
    s6_placeholder: z. B. Zielgruppe hat Playverto noch nie genutzt, halte den Ton warm und nicht förmlich.
    s6_compare_label: Teilnehmenden erlauben, ihre Antworten zu vergleichen
    s6_compare_desc: Zeige auf der Dankesseite einen CTA an, der zeigt, wie ihre Antworten im Vergleich zu allen anderen abschneiden.
    quiz_label: "Daraus ein Quiz machen"
    quiz_desc: "Markiere Antworten als richtig oder falsch, zeige Spielern ihre Punktzahl und lass sie sich mit anderen vergleichen. Die richtigen Antworten legst du nach dem Generieren fest."
    s7_eyebrow: Schritt 07 · Letzter Schliff
    s7_lead: Öffnen Sie ein fertig gestaltetes Verto oder eine leere Leinwand.
    s7_body: Wir wählen ein Hintergrundbild und Kartenbilder aus unserer kuratierten Bibliothek – passend zu Ihrem Thema, Ihrer Zielgruppe und der Frage auf jeder Karte.
