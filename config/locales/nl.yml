    s6_eyebrow: Stap 06 · Context
    optional: Optioneel
    s6_lead: Nog iets dat we moeten meenemen?
    s6_body: Toon, must-asks, dingen om te vermijden, eigenaardigheden van het publiek. Sla over als er niets extra's is.
    s6_examples:
    - Moet een vraag bevatten over financieringsroutes en obstakels voor subsidies.
    - Vermijd jargon — veel respondenten spreken Engels als tweede taal.
    - Houd de toon warm, niet zakelijk.
    s6_title: Is er nog iets dat we moeten weten?
    s6_placeholder: bijv. Het publiek heeft Playverto nog nooit gebruikt; houd de toon warm, niet zakelijk.
    s6_compare_label: Laat respondenten hun antwoorden vergelijken
    s6_compare_desc: Toon een CTA op de bedankpagina die laat zien hoe hun antwoorden zich verhouden tot die van anderen.
    quiz_label: "Maak hier een quiz van"
    quiz_desc: "Markeer antwoorden goed of fout, toon spelers hun score en laat ze zich met anderen vergelijken. Je stelt de juiste antwoorden in na het genereren."
    s7_eyebrow: Stap 07 · Laatste touch
    s7_lead: Open in een kant-en-klare Verto of een leeg canvas.
    s7_body: We kiezen een achtergrond en afbeeldingen per kaart uit onze samengestelde bibliotheek — afgestemd op jouw thema, doelgroep en de vraag op elke kaart.
    s7_perks_label: Wat 'inhoud invullen' je oplevert
    s7_perks:
    - Een achtergrond die bij je thema past
    - Afbeeldingen op elke kaart, inclusief swipe-kaarten
    - Vernieuwen in de editor totdat het goed voelt
    s7_title: Hoe wil je beginnen?
    s7_sub: Je kunt achteraf alles nog aanpassen in de editor.
    s7_recommended: Aanbevolen
    s7_populate_label: Inhoud invullen
    s7_populate_desc: Open de editor met een achtergrond en een afbeelding op elke kaart, afgestemd op jouw briefing.
    s7_blank_label: "Opnieuw beginnen"
    s7_blank_desc: "Open een schone editor en voeg je eigen beelden toe, kaart voor kaart."
