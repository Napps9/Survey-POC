    s6_lead: Algo mais que devamos incluir?
    s6_body: Tom, perguntas obrigatórias, coisas a evitar, peculiaridades do público. Salte se não houver nada extra.
    s6_examples:
    - Deve incluir uma pergunta sobre fontes de financiamento e barreiras a subsídios.
    - Evite jargão — muitos respondentes falam inglês como segunda língua.
    - Mantenha um tom caloroso, não corporativo.
