    welcome_title: Vamos construir o seu Verto.
    welcome_sub: Transformaremos o seu briefing num Verto que segue as regras do Playverto.
    welcome_ready_html: Pressione <strong style="color:rgba(0,0,0,0.6);">Seguinte</strong> quando estiver pronto.
    examples: Exemplos
    s1_eyebrow: Passo 01 · Sobre o seu Verto
    s1_lead: O tema único e abrangente.
    s1_body: Mantenha-o amplo — irá restringir a abordagem nos passos seguintes. Uma ou duas palavras costumam ser suficientes.
    s1_examples:
    - Ação climática
    - Educação de refugiados
    - Segurança alimentar
    s1_title: De que trata o seu Verto?
    s1_placeholder: 'ex.: Bem-estar juvenil'
    s1_hint_body: Mantenha-o amplo — irá restringir a abordagem nos passos seguintes.
    s2_eyebrow: Passo 02 · Quem vai responder
    s2_lead: "Primeiro a idade — depois o lugar e o contexto."
    s2_body: "Comece pela faixa etária e acrescente onde estão e o que fazem. «Enfermeiras de 25–40 em Manchester» é melhor do que «adultos» — idade, lugar, função, língua e estilo de vida afinam as perguntas que escrevemos."
    s2_examples:
    - Estudantes universitários de 18–24 anos no Quénia
    - Profissionais de saúde comunitária de primeira linha entre 35 e 55 anos
    - Pais de crianças em idade escolar no interior de NSW
    s2_title: Quem vai responder — e qual a sua idade?
    s2_placeholder: 'ex.: Estudantes universitários de 18–24 anos no Quénia'
    s2_hint_body: Estilo de vida, função, região, idioma — qualquer coisa que molde a forma como este grupo pensa.
    s3_eyebrow: Passo 03 · O objetivo de aprendizagem
    s3_lead: O insight que mudaria uma decisão.
    s3_body: Salte aquilo que já sabe. Procure aquela única coisa que, se aprendesse, mudaria o que faz a seguir.
    s3_examples:
    - Porque é que os voluntários desistem após o terceiro mês?
    - O que está a impedir as pessoas de aceder ao nosso banco alimentar?
    - O nosso programa juvenil aumenta realmente a confiança — e onde exatamente?
    s3_title: O que quer aprender com eles?
    s3_placeholder: 'ex.: Porque é que os voluntários desistem após o terceiro mês?'
    s3_hint_body: Salte o que já sabe — procure aquela única coisa que mudaria o que faz a seguir.
    s4_eyebrow: Passo 04 · Idiomas
    s4_lead: Alcance todos no seu próprio idioma.
    s4_body: Escreveremos o Verto no seu idioma principal e, em seguida, elaboraremos uma versão igualmente boa em cada um dos outros idiomas. Todas as versões fazem as mesmas perguntas, para que os resultados permaneçam alinhados.
    s4_title: Que idiomas deve este Verto falar?
    s4_primary_label: Idioma principal
    s5_eyebrow: Passo 05 · Cores da marca
    s5_lead: Faça com que pareça seu.
    s5_body: É assim que o seu Verto aparece a todos os que o jogarem. Pode afiná-lo a qualquer momento no editor.
