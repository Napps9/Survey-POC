  welcome_mailer:
    subject: "Karibu Playverto — tuunde Verto yako ya kwanza"
    heading: "Kila kitu tayari"
    intro: "Barua pepe yako imethibitishwa. Verto ni utafiti ambao watu hufurahia kujibu: kadi wanazopitia kwa kugusa, si fomu wanayovumilia. Njia ya haraka zaidi ya kuona hili ni kuanza na kiolezo kisha kubadilisha maswali."
    cta: "Anza na kiolezo"
    step_one: "Chagua kiolezo, au eleza unachotaka kujifunza na uache Playverto iandike maswali."
    step_two: "Hariri kadi yoyote. Alama ya Verto upande wa kulia inakuonyesha kinachofanya kazi na kisichofanya kazi."
    step_three: "Chapisha, kisha shiriki kiungo au msimbo wake wa QR. Matokeo huingia watu wanapojibu."
