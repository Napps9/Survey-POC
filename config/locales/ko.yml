        - text: "더 이상 저희를 이용할 수 없다면 어떤 기분일 것 같나요?"
          options: ["매우 아쉬울 거예요", "조금 아쉬울 거예요", "아쉽지 않을 거예요"]
        - text: "저희에게서 얻는 가장 큰 이점은 무엇인가요?"
        - text: "어떤 사람이 가장 큰 도움을 받을 것 같나요?"
