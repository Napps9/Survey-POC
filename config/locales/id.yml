    welcome_badge: Verto Baru
    welcome_title: Mari bangun Verto Anda.
    welcome_sub: Kami akan mengubah brief Anda menjadi Verto yang mengikuti aturan Playverto.
    welcome_ready_html: Tekan <strong style="color:rgba(0,0,0,0.6);">Lanjut</strong> saat Anda siap.
    examples: Contoh
    s1_eyebrow: Langkah 01 · Tentang Verto Anda
    s1_lead: Satu topik utama yang menyeluruh.
    s1_body: Buat luas — Anda akan mempersempit sudut pandang di langkah berikutnya. Satu atau dua kata biasanya sudah cukup.
    s1_examples:
    - Aksi iklim
    - Pendidikan pengungsi
    - Ketahanan pangan
    s1_title: Tentang apa Verto Anda?
    s1_placeholder: misal Kesejahteraan remaja
    s1_hint_body: Buat luas — Anda akan mempersempit sudut pandang di langkah berikutnya.
    s2_eyebrow: Langkah 02 · Siapa yang menjawab
    s2_lead: "Usia dulu — lalu tempat dan konteks."
    s2_body: "Mulai dari rentang usia, lalu tambahkan di mana mereka dan apa yang mereka lakukan. 'Perawat 25–40 di Manchester' lebih baik daripada 'orang dewasa' — usia, tempat, peran, bahasa, dan gaya hidup mempertajam pertanyaan yang kami tulis."
    s2_examples:
    - Mahasiswa 18–24 tahun di Kenya
    - Petugas kesehatan komunitas garis depan usia 35–55
    - Orang tua anak usia sekolah di pedesaan NSW
    s2_title: Siapa yang menjawab — dan berapa usia mereka?
    s2_placeholder: misal Mahasiswa 18–24 tahun di Kenya
    s2_hint_body: Gaya hidup, peran, wilayah, bahasa — apa pun yang membentuk cara berpikir kelompok ini.
    s3_eyebrow: Langkah 03 · Tujuan pembelajaran
    s3_lead: Wawasan yang akan mengubah suatu keputusan.
    s3_body: Lewati hal-hal yang sudah Anda ketahui. Targetkan satu hal yang, jika Anda mempelajarinya, akan mengubah langkah Anda selanjutnya.
    s3_examples:
    - Mengapa relawan berhenti setelah bulan ketiga?
    - Apa yang menghalangi orang mengakses bank pangan kami?
    - Apakah program remaja kami benar-benar meningkatkan kepercayaan diri — dan di bagian mana tepatnya?
    s3_title: Apa yang ingin Anda pelajari dari mereka?
    s3_placeholder: misal Mengapa relawan berhenti setelah bulan ketiga?
    s3_hint_body: Lewati apa yang sudah Anda ketahui — targetkan satu hal yang akan mengubah langkah Anda selanjutnya.
    s4_eyebrow: Langkah 04 · Bahasa
    s4_lead: Jangkau semua orang dalam bahasa mereka sendiri.
    s4_body: Kami akan menulis Verto dalam bahasa utama Anda, lalu membuat versi yang sama bagusnya dalam setiap bahasa lain. Setiap versi mengajukan pertanyaan yang sama, sehingga hasilnya tetap selaras.
    s4_title: Dalam bahasa apa Verto ini harus berbicara?
    s4_primary_label: Bahasa utama
    s5_eyebrow: Langkah 05 · Warna merek
    s5_lead: Buat agar terasa seperti Anda.
    s5_body: Begitulah tampilan Verto Anda bagi semua orang yang memainkannya. Anda dapat menyesuaikannya kapan saja dari editor.
    s5_live_preview: Pratinjau langsung
    s5_quick_poll: Polling cepat
    s5_mock_q: Bagaimana menurut Anda?
    s5_mock_opt: Suka sekali
    s5_title: Pilih warna merek Anda.
    s5_sub: Pilih tiga. Akan diterapkan di seluruh pengalaman Verto ini.
