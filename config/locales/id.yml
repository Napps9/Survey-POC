    section_brand_colours: Warna merek
    brand_primary: Utama
    brand_primary_desc: Judul & aksen
    brand_cta: Tombol (CTA)
    brand_cta_desc: Tombol Lanjut / Kirim
    brand_bg: Latar belakang
    brand_bg_desc: Kanvas di belakang kartu
    s6_eyebrow: Langkah 06 · Konteks
    optional: Opsional
    s6_lead: Apa lagi yang harus kami sertakan?
    s6_body: Nada, hal-hal yang harus ditanyakan, hal-hal yang harus dihindari, keunikan audiens. Lewati jika tidak ada tambahan.
    s6_examples:
    - Harus menyertakan pertanyaan tentang jalur pendanaan dan hambatan untuk hibah.
    - Hindari jargon — banyak responden berbicara bahasa Inggris sebagai bahasa kedua.
    - Pertahankan nada yang hangat, bukan korporat.
    s6_title: Apa lagi yang harus kami ketahui?
    s6_placeholder: misal Audiens belum pernah menggunakan Playverto sebelumnya, pertahankan nada hangat, bukan korporat.
    s6_compare_label: Izinkan responden membandingkan jawaban mereka
    s6_compare_desc: Tampilkan CTA di halaman terima kasih yang menunjukkan bagaimana jawaban mereka dibandingkan dengan jawaban orang lain.
    quiz_label: "Jadikan ini kuis"
    quiz_desc: "Tandai jawaban benar atau salah, tampilkan skor kepada pemain, dan biarkan mereka membandingkan dengan yang lain. Anda menetapkan jawaban yang benar setelah membuat."
    s7_eyebrow: Langkah 07 · Sentuhan akhir
    s7_lead: Buka dalam tampilan Verto yang sudah jadi, atau kanvas kosong.
    s7_body: Kami memilih latar belakang dan gambar per kartu dari pustaka kurasi kami — disesuaikan dengan tema, audiens, dan pertanyaan di setiap kartu.
    s7_perks_label: Keuntungan menggunakan isi otomatis
    s7_perks:
    - Latar belakang survei yang sesuai tema
    - Gambar di setiap kartu, termasuk kartu geser
    - Acak di editor hingga terasa pas
    s7_title: Bagaimana Anda ingin memulai?
    s7_sub: Anda masih bisa mengubah apa saja di editor.
    s7_recommended: Direkomendasikan
    s7_populate_label: Isi konten otomatis
    s7_populate_desc: Buka editor dengan latar belakang dan gambar di setiap kartu, disesuaikan dengan brief Anda.
    s7_blank_label: "Mulai baru"
    s7_blank_desc: "Buka editor kosong dan tambahkan gambarmu sendiri, kartu demi kartu."
