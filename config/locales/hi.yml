    optional: वैकल्पिक
    s6_lead: और कुछ जो हमें शामिल करना चाहिए?
    s6_body: स्वर, अनिवार्य प्रश्न, बचने योग्य बातें, दर्शकों की विशेषताएं। यदि कुछ अतिरिक्त नहीं है तो छोड़ दें।
    s6_examples:
    - वित्तपोषण मार्गों और अनुदान की बाधाओं के बारे में एक प्रश्न अवश्य शामिल करें।
    - शब्दजाल से बचें — कई उत्तरदाता अंग्रेज़ी दूसरी भाषा के रूप में बोलते हैं।
    - स्वर को गर्मजोशी भरा रखें, कॉर्पोरेट नहीं।
    s6_title: और कुछ जो हमें जानना चाहिए?
    s6_placeholder: उदा. दर्शकों ने पहले कभी Playverto का उपयोग नहीं किया है, स्वर को गर्मजोशी भरा रखें, कॉर्पोरेट नहीं।
    s6_compare_label: उत्तरदाताओं को अपने उत्तरों की तुलना करने दें
    s6_compare_desc: धन्यवाद पृष्ठ पर एक CTA दिखाएं जो बताता है कि उनके उत्तर बाकी सभी की तुलना में कैसे हैं।
    quiz_label: "इसे एक क्विज़ बनाएं"
    quiz_desc: "उत्तरों को सही या गलत चिह्नित करें, खिलाड़ियों को उनका स्कोर दिखाएं और उन्हें दूसरों से तुलना करने दें। आप जनरेट करने के बाद सही उत्तर सेट करते हैं।"
    s7_eyebrow: चरण 07 · अंतिम स्पर्श
    s7_lead: तैयार दिखने वाले Verto में खोलें, या एक खाली कैनवास से शुरू करें।
    s7_body: हम अपनी क्यूरेटेड लाइब्रेरी से एक बैकड्रॉप और प्रत्येक कार्ड के लिए इमेजरी चुनते हैं — जो आपकी थीम, दर्शकों और हर कार्ड के प्रश्न से मेल खाती है।
    s7_perks_label: पॉप्युलेट से आपको क्या मिलता है
    s7_perks:
    - थीम से मेल खाता सर्वे बैकड्रॉप
    - स्वाइप कार्ड सहित हर कार्ड पर इमेजरी
    - सही लगने तक एडिटर में शफ़ल करें
    s7_title: आप कैसे शुरू करना चाहेंगे?
    s7_sub: आप एडिटर में कभी भी कुछ भी बदल सकते हैं।
    s7_recommended: अनुशंसित
    s7_populate_label: कॉन्टेंट पॉप्युलेट करें
    s7_populate_desc: आपके ब्रीफ़ से मेल खाते बैकड्रॉप और हर कार्ड पर तस्वीर के साथ एडिटर खोलें।
    s7_blank_label: "नए सिरे से शुरू करें"
