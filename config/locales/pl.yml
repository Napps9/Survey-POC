    brand_primary_desc: Nagłówki i akcenty
    brand_cta: Przyciski (CTA)
    brand_cta_desc: Przyciski Dalej / Wyślij
    brand_bg: Tło
    brand_bg_desc: Powierzchnia za kartami
    s6_eyebrow: Krok 06 · Kontekst
    optional: Opcjonalne
    s6_lead: Coś jeszcze, co powinniśmy uwzględnić?
    s6_body: Ton, pytania obowiązkowe, rzeczy do uniknięcia, specyfika odbiorców. Pomiń, jeśli nie ma nic dodatkowego.
    s6_examples:
    - Musi zawierać pytanie o ścieżki finansowania i bariery w uzyskaniu grantów.
    - Unikaj żargonu — wielu respondentów mówi po angielsku jako drugim języku.
    - Utrzymaj ciepły ton, nie korporacyjny.
    s6_title: Coś jeszcze, o czym powinniśmy wiedzieć?
    s6_placeholder: np. Odbiorcy nigdy wcześniej nie korzystali z Playverto, utrzymaj ciepły ton, nie korporacyjny.
    s6_compare_label: Pozwól respondentom porównywać swoje odpowiedzi
    s6_compare_desc: Pokaż CTA na stronie podziękowania, które ujawnia, jak ich odpowiedzi wypadają na tle innych.
    quiz_label: "Zrób z tego quiz"
    quiz_desc: "Oznaczaj odpowiedzi jako poprawne lub błędne, pokazuj graczom ich wynik i pozwól im porównać się z innymi. Poprawne odpowiedzi ustawiasz po wygenerowaniu."
    s7_eyebrow: Krok 07 · Ostatnie szlify
    s7_lead: Otwórz gotowy projekt w Verto lub zacznij od pustego płótna.
    s7_body: Dobieramy tło i obrazy do każdej karty z naszej starannie dobranej biblioteki — dopasowane do Twojego motywu, grupy docelowej i pytania na każdej karcie.
    s7_perks_label: Co zyskujesz dzięki automatycznemu wypełnieniu
    s7_perks:
    - Tło dopasowane do motywu ankiety
    - Obrazy na każdej karcie, w tym kartach do przesuwania
    - Losuj w edytorze, aż efekt będzie odpowiedni
    s7_title: Jak chcesz zacząć?
    s7_sub: Wszystko możesz zmienić później w edytorze.
    s7_recommended: Zalecane
    s7_populate_label: Wypełnij treść
    s7_populate_desc: Otwórz edytor z tłem i zdjęciem na każdej karcie, dopasowanymi do Twojego briefu.
    s7_blank_label: "Zacznij od nowa"
    s7_blank_desc: "Otwórz czysty edytor i dodawaj własne obrazy, karta po karcie."
