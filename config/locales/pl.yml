    welcome_badge: Nowe Verto
    welcome_title: Stwórzmy Twoje Verto.
    welcome_sub: Zamienimy Twój brief w Verto zgodne z zasadami Playverto.
    welcome_ready_html: Naciśnij <strong style="color:rgba(0,0,0,0.6);">Dalej</strong>, gdy będziesz gotowy.
    examples: Przykłady
    s1_eyebrow: Krok 01 · O Twoim Verto
    s1_lead: Jeden nadrzędny temat.
    s1_body: Niech będzie szeroki — kąt zawęzisz w kolejnych krokach. Zwykle wystarczy jedno lub dwa słowa.
    s1_examples:
    - Działania klimatyczne
    - Edukacja uchodźców
    - Bezpieczeństwo żywnościowe
    s1_title: O czym jest Twoje Verto?
    s1_placeholder: np. Dobrostan młodzieży
    s1_hint_body: Niech będzie szeroki — kąt zawęzisz w kolejnych krokach.
    s2_eyebrow: Krok 02 · Kto odpowiada
    s2_lead: "Najpierw wiek — potem miejsce i kontekst."
    s2_body: "Zacznij od przedziału wiekowego, potem dodaj, gdzie są i czym się zajmują. „Pielęgniarki 25–40 z Manchesteru” bije „dorosłych” — wiek, miejsce, rola, język i styl życia wyostrzają pytania, które piszemy."
    s2_examples:
    - Studenci w wieku 18–24 lat w Kenii
    - Pracownicy zdrowia środowiskowego w wieku 35–55 lat
    - Rodzice dzieci w wieku szkolnym z wiejskich obszarów NSW
    s2_title: Kto odpowiada — i w jakim jest wieku?
    s2_placeholder: np. Studenci w wieku 18–24 lat w Kenii
    s2_hint_body: Styl życia, rola, region, język — wszystko, co kształtuje sposób myślenia tej grupy.
    s3_eyebrow: Krok 03 · Cel poznawczy
    s3_lead: Wniosek, który zmieniłby decyzję.
    s3_body: Pomiń to, co już wiesz. Skup się na tej jednej rzeczy, która — gdybyś się o niej dowiedział — zmieniłaby Twoje następne kroki.
    s3_examples:
    - Dlaczego wolontariusze rezygnują po trzecim miesiącu?
    - Co powstrzymuje ludzi przed korzystaniem z naszego banku żywności?
    - Czy nasz program dla młodzieży faktycznie zwiększa pewność siebie — i w jakich obszarach?
    s3_title: Czego chcesz się od nich dowiedzieć?
    s3_placeholder: np. Dlaczego wolontariusze rezygnują po trzecim miesiącu?
    s3_hint_body: Pomiń to, co już wiesz — skup się na tej jednej rzeczy, która zmieniłaby Twoje następne kroki.
    s4_eyebrow: Krok 04 · Języki
    s4_lead: Dotrzyj do każdego w jego języku.
    s4_body: Napiszemy Verto w Twoim głównym języku, a następnie przygotujemy równie dobrą wersję w każdym innym języku. Każda wersja zadaje te same pytania, więc wyniki pozostają spójne.
    s4_title: W jakich językach ma mówić to Verto?
    s4_primary_label: Język główny
    s5_eyebrow: Krok 05 · Kolory marki
    s5_lead: Spraw, by wyglądało jak Ty.
    s5_body: Tak Twoje Verto wygląda dla każdego, kto je wypełnia. Możesz dostroić ustawienia w dowolnym momencie w edytorze.
    s5_live_preview: Podgląd na żywo
    s5_quick_poll: Szybka ankieta
    s5_mock_q: Jak Ci się podoba?
    s5_mock_opt: Uwielbiam
    s5_title: Wybierz kolory swojej marki.
    s5_sub: Wybierz trzy. Będą stosowane w całym tym Verto.
    section_how_to_start: Jak zacząć
    section_brand_colours: Kolory marki
    brand_primary: Główny
    brand_primary_desc: Nagłówki i akcenty
    brand_cta: Przyciski (CTA)
    brand_cta_desc: Przyciski Dalej / Wyślij
    brand_bg: Tło
    brand_bg_desc: Powierzchnia za kartami
    s6_eyebrow: Krok 06 · Kontekst
    optional: Opcjonalne
    s6_lead: Coś jeszcze, co powinniśmy uwzględnić?
    s6_body: Ton, pytania obowiązkowe, rzeczy do uniknięcia, specyfika odbiorców. Pomiń, jeśli nie ma nic dodatkowego.
    s6_examples:
    - Musi zawierać pytanie o ścieżki finansowania i bariery w uzyskaniu grantów.
    - Unikaj żargonu — wielu respondentów mówi po angielsku jako drugim języku.
    - Utrzymaj ciepły ton, nie korporacyjny.
    s6_title: Coś jeszcze, o czym powinniśmy wiedzieć?
    s6_placeholder: np. Odbiorcy nigdy wcześniej nie korzystali z Playverto, utrzymaj ciepły ton, nie korporacyjny.
    s6_compare_label: Pozwól respondentom porównywać swoje odpowiedzi
    s6_compare_desc: Pokaż CTA na stronie podziękowania, które ujawnia, jak ich odpowiedzi wypadają na tle innych.
    quiz_label: "Zrób z tego quiz"
    quiz_desc: "Oznaczaj odpowiedzi jako poprawne lub błędne, pokazuj graczom ich wynik i pozwól im porównać się z innymi. Poprawne odpowiedzi ustawiasz po wygenerowaniu."
    s7_eyebrow: Krok 07 · Ostatnie szlify
    s7_lead: Otwórz gotowy projekt w Verto lub zacznij od pustego płótna.
    s7_body: Dobieramy tło i obrazy do każdej karty z naszej starannie dobranej biblioteki — dopasowane do Twojego motywu, grupy docelowej i pytania na każdej karcie.
    s7_perks_label: Co zyskujesz dzięki automatycznemu wypełnieniu
    s7_perks:
    - Tło dopasowane do motywu ankiety
    - Obrazy na każdej karcie, w tym kartach do przesuwania
    - Losuj w edytorze, aż efekt będzie odpowiedni
    s7_title: Jak chcesz zacząć?
    s7_sub: Wszystko możesz zmienić później w edytorze.
    s7_recommended: Zalecane
    s7_populate_label: Wypełnij treść
    s7_populate_desc: Otwórz edytor z tłem i zdjęciem na każdej karcie, dopasowanymi do Twojego briefu.
    s7_blank_label: "Zacznij od nowa"
    s7_blank_desc: "Otwórz czysty edytor i dodawaj własne obrazy, karta po karcie."
