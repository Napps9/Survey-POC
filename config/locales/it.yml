    welcome_badge: Nuovo Verto
    welcome_title: Costruiamo il tuo Verto.
    welcome_sub: Trasformeremo il tuo brief in un Verto che segue le regole di Playverto.
    welcome_ready_html: Premi <strong style="color:rgba(0,0,0,0.6);">Avanti</strong> quando sei pronto.
    examples: Esempi
    s1_eyebrow: Passo 01 · Sul tuo Verto
    s1_lead: Il singolo argomento generale.
    s1_body: Mantienilo ampio — affinerai l'angolazione nei prossimi passi. Una o due parole di solito bastano.
    s1_examples:
    - Azione per il clima
    - Educazione per i rifugiati
    - Sicurezza alimentare
    s1_title: Di cosa parla il tuo Verto?
    s1_placeholder: es. Benessere giovanile
    s1_hint_body: Mantienilo ampio — affinerai l'angolazione nei prossimi passi.
    s2_eyebrow: Passo 02 · Chi risponde
    s2_lead: "Prima l'età — poi luogo e contesto."
    s2_body: "Parti dalla fascia d'età, poi aggiungi dove sono e cosa fanno. «Infermiere di 25–40 anni a Manchester» batte «adulti» — età, luogo, ruolo, lingua e stile di vita affinano le domande che scriviamo."
    s2_examples:
    - Studenti universitari 18–24 in Kenya
    - Operatori sanitari di comunità in prima linea 35–55
    - Genitori di bambini in età scolare nelle zone rurali del NSW
    s2_title: Chi risponde — e che età ha?
    s2_placeholder: es. Studenti universitari 18–24 in Kenya
    s2_hint_body: Stile di vita, ruolo, regione, lingua — qualsiasi cosa influenzi il modo di pensare di questo gruppo.
    s3_eyebrow: Passo 03 · L'obiettivo di apprendimento
    s3_lead: L'intuizione che cambierebbe una decisione.
    s3_body: Tralascia le cose che già sai. Punta all'unica cosa che, se la scoprissi, cambierebbe il tuo prossimo passo.
    s3_examples:
    - Perché i volontari abbandonano dopo il terzo mese?
    - Cosa impedisce alle persone di accedere al nostro banco alimentare?
    - Il nostro programma per i giovani aumenta davvero la fiducia — e dove esattamente?
    s3_title: Cosa vuoi scoprire da loro?
    s3_placeholder: es. Perché i volontari abbandonano dopo il terzo mese?
    s3_hint_body: Tralascia ciò che già sai — punta all'unica cosa che cambierebbe il tuo prossimo passo.
    s4_eyebrow: Passo 04 · Lingue
    s4_lead: Raggiungi tutti nella loro lingua.
    s4_body: Scriveremo il Verto nella tua lingua principale, poi creeremo una versione altrettanto valida in ogni altra lingua. Ogni versione pone le stesse domande, così i risultati restano allineati.
