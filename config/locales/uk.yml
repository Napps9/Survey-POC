      name: "Задоволеність клієнтів"
      tagline: "Короткий CSAT-пульс: оцініть досвід, визначте, що спрацювало, і почуйте, що варто виправити."
      cards:
        - text: "Як ми впоралися?"
          description: "Кілька швидких дотиків — дякуємо, що допомагаєте нам ставати кращими."
        - text: "Наскільки ви загалом задоволені своїм досвідом?"
          options: ["Дуже незадоволений(-а)", "Незадоволений(-а)", "Нейтрально", "Задоволений(-а)", "Дуже задоволений(-а)"]
        - text: "Яка частина вашого досвіду запам'яталася найбільше?"
          options: ["Зручність використання", "Швидкість", "Підтримка", "Співвідношення ціни та якості", "Якість"]
        - text: "Чи скористалися б ви нами знову?"
        - text: "Що одне ми могли б зробити краще?"
    onboarding:
      name: "Онбординг нових користувачів"
      tagline: "Дізнайтеся, де нові користувачі застрягають і що допомогло б їм швидше досягти першого успіху."
      cards:
        - text: "Як пройшов початок роботи?"
          description: "Ви щойно все налаштували — розкажіть, як усе пройшло, поки враження свіжі."
        - text: "Наскільки легко було почати?"
          options: ["Дуже важко", "Важко", "Нормально", "Легко", "Дуже легко"]
        - text: "Де ви застрягли, якщо таке було?"
          options: ["Під час реєстрації", "Під час налаштування", "Шукаючи потрібне", "Розбираючись, як це працює", "Я не застрягав(-ла)"]
        - text: "Що допомогло б вам почати швидше? Виберіть усе, що підходить."
          options: ["Покроковий тур", "Шаблони чи приклади", "Зрозуміліші інструкції", "Підтримка в живому чаті", "Коротке відео"]
        - text: "Якби ви могли змінити одну річ у початку роботи, що б це було?"
    employee-pulse:
      name: "Пульс-опитування працівників"
      tagline: "Швидкий анонімний зріз того, як команда справді почувається цього тижня, — плюс eNPS."
      cards:
        - text: "Як справи насправді?"
          description: "Повністю анонімно — мета в тому, щоб зробити все кращим, а не контролювати."
        - text: "Як ви почуваєтеся щодо роботи цього тижня?"
          options: ["Ледве тримаюся", "Не дуже", "Нормально", "Добре", "Чудово"]
        - text: "Яке у вас зараз навантаження?"
          options: ["Занадто велике", "Трохи завелике", "Саме враз", "Трохи замале", "Занадто мале"]
        - text: "Наскільки ви відчуваєте підтримку від свого керівника?"
          options: ["Зовсім ні", "Трохи", "Певною мірою", "Добре", "Дуже добре"]
        - text: "Наскільки ймовірно, що ви порекомендуєте це місце для роботи?"
        - text: "Яка одна зміна зробила б це місце кращим для роботи?"
    event-feedback:
      name: "Відгуки про подію"
      tagline: "Зафіксуйте, як пройшла ваша подія — найкращі моменти, невдачі й те, чи повернуться гості знову."
      cards:
        - text: "Дякуємо, що прийшли — як вам?"
          description: "Кілька швидких запитань, поки враження ще свіжі."
        - text: "Як би ви оцінили подію загалом?"
          options: ["Погано", "Посередньо", "Добре", "Чудово", "Відмінно"]
        - text: "Що для вас було найкращим?"
          options: ["Спікери", "Зміст", "Нетворкінг", "Локація", "Організація"]
        - text: "Чи прийшли б ви знову?"
        - text: "Наскільки ймовірно, що ви порекомендуєте цю подію колезі?"
        - text: "Що зробило б наступну подію ще кращою?"
    product-market-fit:
      name: "Відповідність продукту ринку"
      tagline: "Класичний тест Шона Елліса — як люди почувалися б без вас і хто цінує вас найбільше."
      cards:
        - text: "Допоможіть визначити, куди нам рухатися далі"
          description: "Кілька чесних відповідей справді мають значення — дякуємо."
        - text: "Як би ви почувалися, якби більше не могли нами користуватися?"
          options: ["Дуже розчарований(-а)", "Дещо розчарований(-а)", "Не розчарований(-а)"]
        - text: "Яку головну користь ви від нас отримуєте?"
        - text: "Кому, на вашу думку, це принесло б найбільше користі?"
          options: ["Людям, як я", "Початківцям", "Професіоналам", "Командам", "Не впевнений(-а)"]
        - text: "Як ми можемо зробити це кращим для вас?"
