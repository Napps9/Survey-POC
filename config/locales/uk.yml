        - text: "Наскільки ймовірно, що ви порекомендуєте нас другові чи колезі?"
        - text: "Яка головна причина вашої оцінки?"
        - text: "Що з цього найкраще описує вас?"
          options: ["Новий клієнт", "Повторний клієнт", "Давній клієнт", "Просто роздивляюся"]
