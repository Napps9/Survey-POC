    s1_placeholder: 'مثال: رفاهية الشباب'
    s1_hint_body: اجعله عامًا — ستضيق الزاوية في الخطوات التالية.
    s2_eyebrow: الخطوة 02 · من سيُجيب
    s2_lead: "الأعمار أولاً — ثم المكان والسياق."
    s2_body: "ابدأ بالفئة العمرية، ثم أضف مكانهم وما يفعلونه. «ممرضات 25–40 في مانشستر» أفضل من «بالغين» — العمر والمكان والدور واللغة ونمط الحياة كلها تجعل الأسئلة أدق."
    s2_examples:
    - طلاب جامعيون بين 18 و24 عامًا في كينيا
    - عاملو الصحة المجتمعية في الخطوط الأمامية بين 35 و55 عامًا
    - آباء أطفال في سن المدرسة في ريف نيو ساوث ويلز
    s2_title: من سيُجيب — وما هي أعمارهم؟
    s2_placeholder: 'مثال: طلاب جامعيون بين 18 و24 عامًا في كينيا'
    s2_hint_body: نمط الحياة، الدور، المنطقة، اللغة — أي شيء يشكّل طريقة تفكير هذه المجموعة.
    s3_eyebrow: الخطوة 03 · هدف التعلّم
    s3_lead: الفكرة التي قد تُغيّر قرارًا.
    s3_body: تجاوز ما تعرفه بالفعل. اسعَ إلى الشيء الواحد الذي إذا تعلمته، سيُغير ما ستفعله بعد ذلك.
    s3_examples:
    - لماذا يتسرب المتطوعون بعد الشهر الثالث؟
    - ما الذي يمنع الناس من الوصول إلى بنك الطعام لدينا؟
    - هل برنامج الشباب لدينا يُغيّر الثقة فعليًا — وأين بالضبط؟
    s3_title: ما الذي تريد أن تتعلمه منهم؟
    s3_placeholder: 'مثال: لماذا يتسرب المتطوعون بعد الشهر الثالث؟'
