# Per-option emoji catalogue, consumed by app/lib/option_icon_library.rb.
#
# Every selection answer shows something in its icon tile — a bare gradient
# reads as unfinished. The tile fills in this order: an explicit 🎨 icon, an
# explicit 🎨 emoji, an emoji hoisted out of the label, a curated SVG from
# config/option_icons.yml, and finally an emoji from here.
#
# `keywords` matches the whole normalised label first, then the longest run of
# its words (articles and other stopwords dropped) — so "Email newsletter"
# finds "email newsletter", and "A colleague" finds "colleague". It used to
# match the whole label ONLY, which meant a keyword fired only for a label that
# was nothing but that keyword; a "how did you hear about us?" card matched
# nothing at all and every option got a coloured shape.
#
# Longest match wins, so a two-word entry beats either of its words. Keys must
# be lowercase, alphanumeric and spaces only (option_emoji_fallback_test checks
# this). `fallbacks` is the cycle used when nothing matches: deliberately
# neutral shapes that carry no meaning of their own, so they decorate the row
# without asserting anything about the answer.
#
# Loaded once at boot — restart the dev server after editing.

fallbacks: ["🔷", "🔶", "🟢", "🟣", "🔴", "🟡"]

keywords:
  # Agreement / sentiment — the most common selection vocabulary.
  "yes": "👍"
  "no": "👎"
  "maybe": "🤔"
  "unsure": "🤔"
  "not sure": "🤔"
  "prefer not to say": "🤐"
  "strongly agree": "💚"
