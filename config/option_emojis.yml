# Per-option emoji catalogue, consumed by app/lib/option_icon_library.rb.
#
# Every selection answer shows something in its icon tile — a bare gradient
# reads as unfinished. The tile fills in this order: an explicit 🎨 icon, an
# explicit 🎨 emoji, an emoji hoisted out of the label, a curated SVG from
# config/option_icons.yml, and finally an emoji from here.
#
# `keywords` matches EXACTLY (after normalising case/punctuation/whitespace),
# same rule as option_icons.yml — conservative on purpose, so an option never
# picks up a surprising emoji. `fallbacks` is the cycle used when nothing
# matches: deliberately neutral shapes that carry no meaning of their own, so
# they decorate the row without asserting anything about the answer.
#
# Loaded once at boot — restart the dev server after editing.

fallbacks: ["🔷", "🔶", "🟢", "🟣", "🔴", "🟡"]

keywords:
  # Agreement / sentiment — the most common selection vocabulary.
  "yes": "👍"
  "no": "👎"
  "maybe": "🤔"
  "unsure": "🤔"
  "not sure": "🤔"
  "prefer not to say": "🤐"
  "strongly agree": "💚"
  "agree": "🙂"
  "neutral": "😐"
  "disagree": "🙁"
  "strongly disagree": "❤️"
  "very unsafe": "😨"
