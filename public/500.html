<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Something went wrong · Playverto</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Deliberately self-contained: no stylesheet, font or image request.
       These pages are the last thing standing when the app can't render, and
       on a 500 the asset host may be exactly what's broken. -->
  <style>
    :root { --navy: #1C2034; --panel: #272D4A; --aqua: #01EACB; --pink: #FF1E6F; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; background: var(--navy);
      color: #F7F7F7;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 460px; background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
      padding: 40px 32px; text-align: center;
    }
    .wordmark {
      font-size: 26px; letter-spacing: 1.4px; line-height: 1; margin-bottom: 28px;
    }
    .wordmark b { font-weight: 400; }
    .wordmark .a { color: #F7F7F7; }
    .wordmark .b { color: var(--pink); }
    h1 { font-size: 20px; font-weight: 400; margin: 0 0 10px; letter-spacing: 0.3px; }
    p { font-size: 15px; line-height: 1.6; color: rgba(247,247,247,0.7); margin: 0 0 24px; }
    .code {
      display: inline-block; font-size: 12px; letter-spacing: 1.5px;
      color: rgba(247,247,247,0.35); margin-bottom: 18px;
    }
    a.cta {
      display: inline-block; padding: 12px 26px; border-radius: 100px;
      background: var(--aqua); color: var(--navy); text-decoration: none;
      font-size: 15px; letter-spacing: 0.4px;
    }
    a.cta:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark"><b><span class="a">play</span><span class="b">verto</span></b></div>
    <div class="code">500</div>
    <h1>Something went wrong at our end</h1>
    <p>This one is on us, not on you — the error has been reported and nothing you entered has been lost. Try again in a moment.</p>
    <a class="cta" href="/">Go to Playverto</a>
  </div>
</body>
</html>
