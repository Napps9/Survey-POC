<!-- VertoNow demo, 1 of 3 -> Page settings > Custom code > Inside <head> tag.
     Upload the four .webp files to Webflow assets first and replace ASSET_BASE
     in part 2 with the folder Webflow serves them from. -->
<style>
.laptop-mockup{
    position: relative;
    width: 100%;
    aspect-ratio: 1.6195 / 1;
    margin: 2rem 0;
  }
  .laptop-mockup .laptop-frame{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    display: block;
  }
  .laptop-mockup .screen-shot{
    position: absolute;
    left: 12.4%;
    top: 3.1%;
    width: 75.15%;
    height: 69%;
    z-index: 1;
    display: block;
    object-fit: cover;
    object-position: center top;
  }
  /* The live Verto. The player composes for the viewport it's given, so the
     frame is laid out at a FIXED logical width and scaled to fit the screen
     area — a multiple of the container would shrink with the page and cross
     the player's 768px mobile breakpoint on narrower screens, putting a phone
     UI in a laptop. Pointer events map through the transform, so it stays
     playable. --embed-scale is set from JS against the measured bezel. */
  .laptop-mockup .screen-embed{
    position: absolute;
    left: 12.4%;
    top: 3.1%;
    width: var(--embed-w, 1376px);
    height: var(--embed-h, 780px);
    transform: scale(var(--embed-scale, 0.51));
    transform-origin: top left;
    border: 0;
    z-index: 2;
    display: block;
    background: #1C2034;
  }
  .laptop-mockup .laptop-frame{ z-index: 3; }
  .laptop-mockup.is-live .screen-shot{ visibility: hidden; }
  .laptop-mockup.is-playable .screen-shot{ visibility: hidden; }

  .demo-note{
    margin-top: 1rem;
    text-align: center;
    font-size: 0.86rem;
    color: var(--text-muted);
  }
  .demo-note a{ color: var(--accent); }

  /* ---------- Phone view (section 03) ----------
     A static shot of the player's real phone layout, in a CSS-drawn bezel —
     an embedded image, so it works in a downloaded copy with no network.
     Deliberately NOT a second live embed: the player keys its session in
     sessionStorage by submit URL, so two live frames of one Verto would write
     into the same response. */
  .try-intro{
    display: flex;
    gap: 2rem;
    align-items: center;
  }
  .try-intro-copy{ flex: 1; min-width: 0; }
  .phone-mockup{
    flex: 0 0 232px;
    padding: 10px;
    border-radius: 36px;
    background: #17171a;
    border: 1px solid var(--border);
    box-shadow: 0 18px 42px rgba(0,0,0,0.38);
    position: relative;
  }
  [data-theme="light"] .phone-mockup{ box-shadow: 0 16px 36px rgba(23,23,26,0.18); }
  .phone-mockup::before{           /* the notch */
    content: "";
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    width: 74px; height: 16px;
    border-radius: 99px;
    background: #17171a;
    z-index: 2;
  }
  .phone-mockup img{
    display: block;
    width: 100%;
    height: auto;
    border-radius: 27px;
  }
  .phone-caption{
    margin-top: 0.8rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .phone-mockup{ transition: flex-basis 0.25s ease; }
  .phone-mockup.is-live{ flex-basis: 280px; }
  .phone-mockup.is-live > img{ visibility: hidden; }
  /* The live Verto in the phone: the player's real 390x844 phone layout,
     scaled onto the still's box. Radius is in UNSCALED units, so 27px of
     visual rounding needs ~40px here at the ~0.67 scale. */
  .phone-screen-embed{
    position: absolute;
    left: 10px; top: 10px;
    width: 390px; height: 844px;
    transform-origin: top left;
    border: 0;
    border-radius: 40px;
    background: #1C2034;
    z-index: 2;
  }
  /* Tap-to-take-the-session affordance, shown on whichever device is showing
     its still while the other one is live. */
  .device-overlay{
    position: absolute;
    inset: 10px;
    border-radius: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
    border: 0;
    cursor: pointer;
    z-index: 4;
    padding: 0;
  }
  .device-overlay[hidden]{ display: none; }
  /* The phone's overlay covers exactly the still (same aspect), not the
     caption beneath it. */
  .phone-mockup > .device-overlay{ inset: 10px 10px auto 10px; aspect-ratio: 390 / 844; }
  .device-overlay span{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: #fff;
    background: #AE1E45;
    padding: 0.55rem 1.1rem;
    border-radius: 99px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .device-overlay:hover span{ transform: scale(1.04); }
  .laptop-overlay{
    /* `inset` must come FIRST: it is a shorthand for top/right/bottom/left, so
       declaring it after them resets the two we actually want back to auto and
       the scrim lands at its static position instead of over the screen. */
    inset: auto;
    left: 12.4%; top: 3.1%;
    width: 75.15%; height: 69%;
    border-radius: 6px;
  }
  /* The phone is much taller than the copy; centring left the text
     stranded halfway down an empty column. */
  .try-intro{ align-items: flex-start; }
/* Phones: the laptop's screen is ~325px wide there — too small to play in.
     Drop the bezel and give the player the full column at a phone-ish aspect. */
  @media (max-width: 860px){
    .laptop-mockup{
      aspect-ratio: auto;
      height: 600px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .laptop-mockup .laptop-frame{ display: none; }
    .laptop-mockup .screen-shot,
    .laptop-mockup .screen-embed{
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }}
  @media (max-width: 860px){
    /* On an actual phone the live embed below IS the mobile experience —
       the still would be redundant. */
    .try-intro{ display: block; }
    .phone-mockup{ display: none; }}

  @media (max-width: 640px){

    /* 600px of a phone screen is most of it, and the rebuilt player doesn't
       have the content to fill that much. */
    .laptop-mockup{ height: 520px; }}
</style>
