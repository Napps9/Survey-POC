services:
  - type: web
    name: survey-poc
    # Docker runtime so the process runs under jemalloc (installed in the
    # Dockerfile and enabled by bin/docker-entrypoint) instead of glibc malloc —
    # ~10-25% lower RSS and less fragmentation on the 512MB instance, with no
    # behaviour change. The entrypoint runs db:prepare on boot; the Dockerfile's
    # CMD (rails server) binds to $PORT via config/puma.rb. libvips is also
    # available here for Active Storage image variants.
    runtime: docker
    plan: starter
    region: oregon
    branch: Main
    # Deploy automatically only once the commit's CI checks (tests, RuboCop,
    # Brakeman, importmap audit) are green on GitHub.
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      # Cap glibc malloc arenas (default is 8 x CPU). Ruby's threaded server
      # otherwise fragments memory across many arenas and RSS creeps up until
      # the 512MB starter instance is OOM-killed and Render returns 502s.
      # Harmless under jemalloc (it ignores this), kept as a safety net.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Conservative Ruby GC tuning for a memory-constrained instance: grow the
      # heap slowly and trigger GC sooner on malloc growth, trading a little CPU
      # for lower peak RSS. Negligible latency impact at this QPS.
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.1"
      - key: RUBY_GC_MALLOC_LIMIT
        value: "16777216"
      - key: RUBY_GC_MALLOC_LIMIT_MAX
        value: "33554432"
      - key: RUBY_GC_OLDMALLOC_LIMIT
        value: "16777216"
      - key: RUBY_GC_OLDMALLOC_LIMIT_MAX
        value: "33554432"
      - key: ANTHROPIC_API_KEY
        sync: false
      # How long any single Claude call may hold a request thread, and how many
      # times it retries, before failing fast. Bounds thread occupancy so a slow
      # Anthropic API can't tie up every Puma thread and 502 the whole app.
      # Code defaults live in AnthropicHelpers; set here to make them tunable.
      - key: ANTHROPIC_TIMEOUT_SECONDS
        value: "120"
      - key: ANTHROPIC_MAX_RETRIES
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true
      # Google OAuth client — used by both "Continue with Google" sign-in and
      # the Sheets export; buttons appear once set. See .env.example.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Active Record Encryption (encrypts stored Google tokens) — see .env.example.
      # Render auto-generates stable values; no manual key handling needed.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # Location search (the "Where do you live?" demographic). The public
      # OpenStreetMap Nominatim server 403s server-side calls from datacenter
      # IPs like Render's, so set a LocationIQ key (a hosted Nominatim that
      # permits server-side use) to make the search work in production. Region
      # defaults to us1; set eu1 for EU. See .env.example / NominatimClient.
      - key: LOCATIONIQ_API_KEY
        sync: false
      - key: LOCATIONIQ_REGION
        value: us1
      - key: APP_HOST
        sync: false
      - key: APP_PROTOCOL
        value: https
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTHENTICATION
        value: plain
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_TLS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: survey-poc-db
          property: connectionString

databases:
  - name: survey-poc-db
    plan: starter
    region: oregon
