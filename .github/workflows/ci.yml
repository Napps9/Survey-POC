name: CI

on:
  pull_request:
  push:
    branches: [ Main, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # The suite stubs every Anthropic client (no real API calls), but the
          # service constructors ENV.fetch the key, so a placeholder must exist.
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          bin/rails db:test:prepare
          bin/rails test

  system_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Browser tests (P2-5). A separate job from `test` on purpose: they drive
      # a real Chrome, so if one goes flaky it is visible and separable rather
      # than taking the unit suite — and therefore the deploy — down with it.
      # ubuntu-latest ships Chrome; ApplicationSystemTestCase finds it, and
      # falls back to Ferrum's own detection if the path ever moves.
      - name: Run system tests
        env:
          RAILS_ENV: test
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          bin/rails db:test:prepare
          bin/rails test:system

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  build_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Proves the exact Dockerfile Render deploys actually builds. No push,
      # no registry credentials, no app secrets needed - docker build only
      # runs bundle install, bootsnap precompile, and
      # SECRET_KEY_BASE_DUMMY=1 assets:precompile (already in the Dockerfile).
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: survey-poc:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

