name: CI

on:
  pull_request:
  push:
    branches: [ Main, main ]
  # A run that dies with `startup_failure` never started, so GitHub refuses to
  # retry it — and the deploy job below only fires from a green run, so that
  # commit sits undeployed with nothing to click. A dispatch on Main runs the
  # whole workflow, deploy included (its `if` tests the ref, not the event).
  # Without this trigger the only way back is an empty commit. 2026-08-26: one
  # push produced two runs, one stuck queued and one startup_failure, and the
  # deploy waited on both.
  workflow_dispatch:

# One run per ref at a time; a newer push cancels the older run. On Main this
# is the SAFE direction, not just the cheap one: the deploy job's hook tells
# Render to deploy the branch's current head, not the commit that went green —
# so a run for commit A finishing after commit B was pushed would deploy B
# untested. Cancelling A leaves B's own run to deploy B once it is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # One forked worker per runner core (test/test_helper.rb does the same
      # locally); each gets its own SQLite file. nproc rather than a literal so
      # a runner with a different core count is neither oversubscribed — which
      # flakes browser timings — nor left idle.
      - name: Run tests
        env:
          RAILS_ENV: test
          # The suite stubs every Anthropic client (no real API calls), but the
          # service constructors ENV.fetch the key, so a placeholder must exist.
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          bin/rails db:test:prepare
          PARALLEL_WORKERS=$(nproc) bin/rails test

  test_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The suite, on production's engine. Dev and test run SQLite while Render
    # runs Postgres, and the two disagree on real things — LOWER() over a json
    # column, DISTINCT over rows that contain one — that SQLite lets straight
    # through. Ask Verto shipped broken exactly that way; this job turns that
    # class of production-only failure into a red check that blocks the deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Each worker creates and loads its own survey_poc_test_N database; the
      # service container's postgres role is a superuser, so CREATE DATABASE
      # needs no extra grant.
      - name: Run tests against Postgres
        env:
          RAILS_ENV: test
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/survey_poc_test
        run: |
          bin/rails db:test:prepare
          PARALLEL_WORKERS=$(nproc) bin/rails test

  system_test:
    runs-on: ubuntu-latest
    # A wedged Chrome used to hold the deploy for GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      # A flake in one shard must not cancel the others: "Re-run failed jobs"
      # then costs one shard's few minutes, not the whole suite's.
      fail-fast: false
      matrix:
        # The one knob for re-balancing. bin/ci_shard deals the sorted file
        # list across however many entries are here; a six-way split of the
        # 2026-09-13 per-file timings lands within ~40s across shards, which
        # is why it is six and not a timing-weighted split.
        shard: [ 0, 1, 2, 3, 4, 5 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Browser tests (P2-5). Separate from `test` on purpose: they drive a
      # real Chrome, so if one goes flaky it is visible and separable rather
      # than taking the unit suite — and therefore the deploy — down with it.
      # Sharded because this job was the whole critical path: one job took
      # 25-28 minutes while everything else finished inside 3.5. Each shard
      # runs its files with one forked worker per core, each worker with its
      # own Puma and Chrome — the same as `bin/rails test:system` locally.
      # ubuntu-latest ships Chrome; ApplicationSystemTestCase finds it, and
      # falls back to Ferrum's own detection if the path ever moves.
      #
      # Explicit file paths bypass the runner's default exclusion of
      # test/system, which is what lets `bin/rails test` run browser tests
      # here. They also skip test:prepare, but nothing depends on it: the
      # system test base class builds the Tailwind stylesheet itself at load.
      # The local gate drives the container's Playwright Chromium; this job
      # drives whatever the runner image ships. Say which, so a rendering or
      # timing difference between the two has somewhere to be seen.
      - name: Record the browser
        run: google-chrome --version || chromium --version || true

      - name: Run system tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          RAILS_ENV: test
          ANTHROPIC_API_KEY: ci-stub-key-no-real-calls
        run: |
          set -euo pipefail
          bin/rails db:test:prepare
          files=$(bin/ci_shard ${{ matrix.shard }} ${{ strategy.job-total }})
          PARALLEL_WORKERS=$(nproc) bin/rails test $files

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots-${{ matrix.shard }}
          # capybara/rails sets Capybara.save_path to tmp/capybara, which is
          # where the failure screenshots actually land; tmp/screenshots was
          # never written to, so nothing was ever uploaded.
          path: tmp/capybara
          if-no-files-found: ignore

  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # Deploys are triggered from HERE, the moment every check above is green,
  # by POSTing the service's Render Deploy Hook. This is the ONLY path:
  # render.yaml has autoDeployTrigger: off, because Render's own checksPass
  # trigger was observed lagging a green commit by a full hour (2026-08-12,
  # 89802a7: checks green 11:43, auto deploy 12:43). So a missing secret or a
  # failed POST is a red job, never a quiet no-op — a green run that deploys
  # nothing is the trap. Fires for a push AND for a workflow_dispatch on Main
  # (the startup_failure hatch above); pull requests carry refs/pull/N/merge
  # and stay excluded by the ref test.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ test, test_postgres, system_test, scan_ruby, scan_js, lint, build_image ]
    if: github.ref == 'refs/heads/Main'

    steps:
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        # The URL embeds a key — it must never be echoed, so curl talks to it
        # silently and only the outcome is printed.
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, and render.yaml has autoDeployTrigger off — nothing will deploy this commit."
            exit 1
          fi
          if curl -fsS -X POST "$HOOK" -o /dev/null; then
            echo "Render deploy triggered."
          else
            echo "::error::Deploy hook POST failed — nothing else will deploy this commit; re-run this job or deploy from the Render dashboard."
            exit 1
          fi

  build_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On Main the image is also PUSHED to GHCR, tagged with the commit, so
      # the thing Render deploys can be the thing CI proved — today Render
      # rebuilds the identical image from source after the deploy hook and
      # this build is thrown away. Switching the service to that image is a
      # Render-side change (registry credential, image-backed service; see
      # docs/DEPLOYMENT_RUNBOOK.md §7) that the owner makes; until then the
      # push costs a few seconds and changes nothing about the deploy.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/Main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Proves the exact Dockerfile Render deploys actually builds. No app
      # secrets needed - docker build only runs bundle install, bootsnap
      # precompile, and SECRET_KEY_BASE_DUMMY=1 assets:precompile (already in
      # the Dockerfile).
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/Main' }}
          tags: |
            ghcr.io/napps9/survey-poc:${{ github.sha }}
            ghcr.io/napps9/survey-poc:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

