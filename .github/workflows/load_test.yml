# Drives the k6 load-test harness (test/load/journey.js) from a GitHub-hosted
# runner, so nobody needs k6 on a local machine. Dispatch-only — it never runs
# on push. The scratch environment it targets is throwaway by procedure
# (test/load/README.md); both the guard step here and the script itself refuse
# hostnames that look like production.
name: Load test (scratch only)

# Two triggers for the same job:
#   * workflow_dispatch — the Actions-tab button. Only works once this file
#     exists on the default branch (GitHub registers dispatchable workflows
#     from there).
#   * push touching test/load/RUN — works from any branch immediately, which
#     is how runs are fired while this workflow lives on a feature branch.
#     RUN holds KEY=VALUE lines mirroring the dispatch inputs.
on:
  push:
    paths: [ "test/load/RUN" ]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Scratch base URL — NEVER production"
        required: true
        default: "https://vertonow.onrender.com"
      token:
        description: "Publish token of the Load Test Verto"
        required: true
      arrivals_per_s:
        description: "Peak respondent arrivals per second (event 83, proof 125)"
        required: false
        default: "10"
      ramp_s:
        description: "Seconds ramping 0 -> peak"
        required: false
        default: "60"
      hold_s:
        description: "Seconds holding peak"
        required: false
        default: "300"
      dwell_scale:
        description: "Think-time multiplier (0.05 compressed, 1.0 realistic)"
        required: false
        default: "0.05"
      brownout:
        description: "1 adds the retry-echo brownout scenario"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve parameters
        env:
          IN_BASE_URL: ${{ inputs.base_url }}
          IN_TOKEN: ${{ inputs.token }}
          IN_ARRIVALS: ${{ inputs.arrivals_per_s }}
          IN_RAMP: ${{ inputs.ramp_s }}
          IN_HOLD: ${{ inputs.hold_s }}
          IN_DWELL: ${{ inputs.dwell_scale }}
          IN_BROWNOUT: ${{ inputs.brownout }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            grep -E '^[A-Z_]+=' test/load/RUN >> "$GITHUB_ENV"
          else
            {
              echo "BASE_URL=$IN_BASE_URL"
              echo "TOKEN=$IN_TOKEN"
              echo "ARRIVALS_PER_S=$IN_ARRIVALS"
              echo "RAMP_S=$IN_RAMP"
              echo "HOLD_S=$IN_HOLD"
              echo "DWELL_SCALE=$IN_DWELL"
              echo "BROWNOUT=$IN_BROWNOUT"
            } >> "$GITHUB_ENV"
          fi

      - name: Refuse production hostnames
        run: |
          case "$BASE_URL" in
            *playverto.com*|*survey-poc.onrender.com*)
              echo "::error::base_url looks like production. Refusing." && exit 1 ;;
          esac

      - name: Install k6
        run: |
          curl -fsSL -o k6.tgz https://github.com/grafana/k6/releases/download/v1.1.0/k6-v1.1.0-linux-amd64.tar.gz
          tar -xzf k6.tgz --strip-components=1
          ./k6 version

      - name: Run k6
        run: |
          ./k6 run --summary-export=k6-summary.json \
            --summary-trend-stats "avg,min,med,p(90),p(95),p(99),max" \
            test/load/journey.js 2>&1 | tee k6-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            k6-summary.json
            k6-output.txt
